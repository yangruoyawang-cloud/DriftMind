services:
  - type: web
    name: driftmind
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX
        value: "30"
